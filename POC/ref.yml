schema_version: "0.1"

defaults:
  data:
    type: list
  report:
    types:
      - table
  component:
    comparator: basic
    match_key: card
    include_matches: false
    threshold_ratio: 0
    threshold_count: 0
  target: {}

sections:
  Basic info:
    component:
      match_key: label
      threshold_ratio: null     # clears the default (explicitly unset)
      threshold_count: null
    data:
      record_schema:
        label:
          dtype: string
          required: true
        value:
          dtype: string
          category: ordinal
          required: true

  javacard.framework.JCSystem:
    data:
      record_schema:
        label:
          dtype: string
          required: true
        value:
          dtype: string
          category: nominal
          required: true
    report:
      types:
        - table
    component:
      match_key: label

  javacardx.apdu.ExtendedLength:
    data:
      record_schema:
        label:
          dtype: string
          required: true
        value:
          dtype: string
          category: nominal
          required: true
    component:
      match_key: label

  javacardx.crypto.Cipher:
    data:
      record_schema:
        label:
          dtype: string
          required: true
        value:
          dtype: string
          category: nominal
          required: true
    component:
      match_key: label
      include_matches: true
