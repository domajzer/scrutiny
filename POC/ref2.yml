schema_version: "0.1"

sections:
  Card performance (ms/op):
    data:
      type: list
      record_schema:
        card:
          dtype: string
        secure_random_256b:
          dtype: number
          category: continuous
        sha1_256b:
          dtype: number
          category: continuous
        sha2_256b:
          dtype: number
          category: continuous
        aes128_encrypt_256b:
          dtype: number
          category: continuous
        aes256_encrypt_256b:
          dtype: number
          category: continuous
        des3_encrypt_256b:
          dtype: number
          category: continuous
        des3_setkey_192b:
          dtype: number
          category: continuous
        aes_setkey_128b:
          dtype: number
          category: continuous
        aes_setkey_256b:
          dtype: number
          category: continuous
        swaes_oneblock_16b:
          dtype: number
          category: continuous
        arraycopy_nonatomic_ram2ram_256b:
          dtype: number
          category: continuous
        arraycopy_nonatomic_eeprom2eeprom_256b:
          dtype: number
          category: continuous

    report:
      types: table

    component:
      comparator: basic
      match_key: card          # the only implicitly required field
      threshold_ratio: 0.02
      threshold_count: 5
      include_matches: true

    target:
      placeholder: placeholder
