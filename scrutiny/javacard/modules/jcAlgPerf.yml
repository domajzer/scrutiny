schema_version: "0.11"

defaults:
  data:
    type: list
    record_schema:
      algorithm:
        dtype: string
        category: nominal
        required: true
      op_name:
        dtype: string
        category: nominal
      measurement_config:
        dtype: string
        category: nominal

      avg_ms:
        dtype: number
        category: continuous
      min_ms:
        dtype: number
        category: continuous
      max_ms:
        dtype: number
        category: continuous

      baseline_avg_ms:
        dtype: number
        category: continuous
      baseline_min_ms:
        dtype: number
        category: continuous
      baseline_max_ms:
        dtype: number
        category: continuous

      data_length:
        dtype: integer
        category: continuous
      total_iterations:
        dtype: integer
        category: continuous
      total_invocations:
        dtype: integer
        category: continuous

      error:
        dtype: string
        category: nominal
      notes:
        dtype: string
        category: nominal

  component:
    comparator: algperf
    match_key: algorithm
    show_key: op_name
    threshold_ratio: 0.20
    include_matches: true

  report:
    types: ["table"]

  target:
    skip_le_ms: 2.0
    small_cap_ms: 10.0
    span_factor: 1.0
    rel_tol: 0.15
    skip_name_patterns: ["clearKey\\(\\)"]
    include_skipped: true

sections:
  "MESSAGE_DIGEST": {}
  "RANDOM_GENERATOR": {}
